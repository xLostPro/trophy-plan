<!doctype html>
<!-- Trophy plan web page. `python trophies.py build` fills in DATA and writes site/index.html (no notes, view only). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trophy Plan</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f27; --muted: #667085; --line: #e3e6eb;
    --accent: #2f5bd3; --good: #1f8a4c; --warn: #b54708; --bad: #b42318;
    --plat: #6d7fa8; --gold: #b8860b; --silver: #8a8f98; --bronze: #a0522d;
    --bar: #e8ebf0; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --card: #181c24; --text: #e8eaef; --muted: #98a2b3; --line: #2a303b;
      --accent: #7b9cff; --good: #47c27e; --warn: #f2a654; --bad: #f97066;
      --plat: #9fb0d8; --gold: #e0b23c; --silver: #b8bdc6; --bronze: #d08a5b;
      --bar: #262c37; --chip: #222833;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.hl b { color: var(--accent); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .filters button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
                    padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  details.game { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  details.game > summary { list-style: none; cursor: pointer; padding: 12px; display: grid;
                           grid-template-columns: 28px 1fr auto; gap: 4px 10px; align-items: center; }
  details.game > summary::-webkit-details-marker { display: none; }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .left { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
  .sub { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 12px; color: var(--muted); }
  .chip.Playing { background: var(--accent); color: #fff; }
  .chip.Next { background: var(--good); color: #fff; }
  .chip.Dropped { opacity: .6; }
  .chip.miss { background: var(--bad); color: #fff; }
  .bar { grid-column: 2 / 4; height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 3px; }
  .body { padding: 0 12px 12px 50px; font-size: 14px; }
  .body dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0 0 8px; }
  .body dt { color: var(--muted); }
  .body dd { margin: 0; overflow-wrap: anywhere; }
  .body p { margin: 6px 0; }
  .trophies { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .trophies li { padding: 7px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 8px; }
  .trophies .t { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; }
  .t.P { background: var(--plat); } .t.G { background: var(--gold); } .t.S { background: var(--silver); } .t.B { background: var(--bronze); }
  .trophies .tn { font-weight: 600; }
  .trophies .done .tn { text-decoration: line-through; color: var(--muted); }
  .trophies .rar { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .trophies .td { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14px; }
  td, th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px 8px; }
  .panel.warn { border-color: var(--bad); }
  .t.M { background: var(--bad); }
  .route { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .route:last-of-type { border-bottom: 0; }
  .route b { font-size: 20px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .route .td { grid-column: 1 / 3; }
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .chart svg { width: 100%; height: 160px; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 5px; }
  @media (max-width: 520px) { .body { padding-left: 12px; } details.game > summary { grid-template-columns: 22px 1fr auto; } }
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (v, d = 0) => v == null ? '–' : (v * 100).toFixed(d) + '%';
const s = D.stats;

function stats() {
  const items = [
    ['Completion', s.completion == null ? '–' : s.completion.toFixed(2) + '%', true],
    ['Without DLC', s.base_completion == null ? '–' : s.base_completion.toFixed(2) + '%', true],
    ['Platinums', s.platinum], ['Trophies', (s.total ?? 0).toLocaleString()], ['Completed games', s.completed],
    ['Level', s.level], ['Games in the plan', D.plan.length],
    ['Only DLC left', D.plan.filter(g => g.base === 1 && g.dlc_left > 0).length],
  ];
  return `<div class="stats">${items.map(([k, v, hl]) =>
    `<div class="stat${hl ? ' hl' : ''}"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('')}</div>`;
}

function game(g, i) {
  const left = g.total - g.earned;
  const chips = [g.status !== 'Backlog' ? `<span class="chip ${esc(g.status)}">${esc(g.status)}</span>` : '',
    g.tier ? `<span class="chip">${esc(g.tier)}</span>` : '',
    g.difficulty != null ? `<span class="chip">${esc(g.difficulty)}/10</span>` : '',
    g.hours != null ? `<span class="chip">~${esc(g.hours)}h</span>` : '',
    g.dlc_left ? `<span class="chip">${g.base === 1 ? 'only DLC left' : g.dlc_left + ' DLC'}</span>` : '',
    g.missable ? `<span class="chip miss">${g.missable} missable</span>` : ''].join('');
  const facts = [['Platform', g.platform], ['Progress', `${g.earned}/${g.total} (${pct(g.earned / g.total)})`],
    ['Base game', pct(g.base)], ['DLC left', g.dlc_left], ['Completion if 100%', g.gain == null ? null : '+' + pct(g.gain, 2)],
    ['Completion per hour', g.gain_h == null ? null : '+' + pct(g.gain_h, 3)],
    ['Platinum', g.plat], ['Guide', g.g_diff ? `${g.g_diff}${g.g_hours ? ', ' + g.g_hours + 'h' : ''}` : null],
    ['DLC guides', g.dlc_guides], ['Online', g.online], ['DLC needed', g.dlc], ['Servers', g.risk], ['Guide flags', g.flags]]
    .filter(([, v]) => v != null && v !== '' && v !== '?');
  const trophies = g.trophies.length ? `<ul class="trophies">${g.trophies.map(([n, d, t, r, grp, tags, done]) =>
    `<li class="${done ? 'done' : ''}"><span class="t ${esc(t)}"></span><span class="tn">${esc(n)}</span>
     <span class="rar">${r == null ? '' : r.toFixed(1) + '%'}</span>
     <span class="td">${esc(d)}${grp && grp !== 'Base game' ? ` · <em>${esc(grp)}</em>` : ''}${tags.length ? ` · <b>${esc(tags.join(', '))}</b>` : ''}</span></li>`).join('')}</ul>` : '';
  return `<details class="game" data-status="${esc(g.status)}" data-dlc="${g.dlc_left ? 1 : 0}">
    <summary><span class="rank">${i + 1}</span><span class="name">${esc(g.name)}</span><span class="left">${left} left</span>
      <span class="bar"><i style="width:${(g.earned / g.total * 100).toFixed(1)}%"></i></span>
      <span class="sub">${chips}</span></summary>
    <div class="body"><dl>${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      ${g.left_txt ? `<p><b>What's left:</b> ${esc(g.left_txt)}</p>` : ''}
      ${g.why ? `<p><b>Why this spot:</b> ${esc(g.why)}</p>` : ''}
      <p><a href="${esc(g.link)}" target="_blank" rel="noopener">Guide / trophy list</a></p>${trophies}</div></details>`;
}

const trophyRow = ([game, n, d, t, r, grp, tags]) =>
  `<li><span class="t ${esc(t)}"></span><span class="tn">${esc(n)}</span>
   <span class="rar">${r == null ? '' : r.toFixed(1) + '%'}</span>
   <span class="td">${esc(game)}${grp && grp !== 'Base game' ? ` · <em>${esc(grp)}</em>` : ''} – ${esc(d)}${tags.length ? ` · <b>${esc(tags.join(', '))}</b>` : ''}</span></li>`;

function watch() {
  if (!D.watch.length && !D.watch_unknown.length) return '';
  const items = D.watch.length ? `<ul class="trophies" style="border-top:0">${D.watch.map(([game, st, n, d, grp]) =>
    trophyRow([`${game} (${st})`, n, d, 'M', null, grp, []])).join('')}</ul>`
    : '<p class="muted">No missable trophies left in your Playing / Next games.</p>';
  const unk = D.watch_unknown.length ? `<p class="muted">Can't check (guide for another version, or none): ${esc(D.watch_unknown.join(', '))}</p>` : '';
  return `<h2>Missable watch</h2><div class="panel${D.watch.length ? ' warn' : ''}">${items}${unk}</div>`;
}

function planner() {
  const rows = D.route.map(([t, names, hrs, after]) => `<div class="route"><b>${t}%</b>
    <span>~${esc(hrs)}h → ${after.toFixed(2)}%</span><span class="td muted">${esc(names.join(' → '))}</span></div>`).join('');
  return `<h2>Completion planner</h2><div class="panel">${rows || '<p class="muted">Not enough estimates to plan with yet.</p>'}
    <p class="muted">From ${D.now.toFixed(2)}%: games with the most Completion per estimated hour first, each finished 100%.</p></div>`;
}

function easiest() {
  if (!D.easy.length) return '';
  return `<h2>Easiest trophies left</h2><details class="panel"><summary class="muted" style="cursor:pointer;padding:8px 0">
    The ${D.easy.length} most commonly earned trophies you still need, across your games</summary>
    <ul class="trophies">${D.easy.map(trophyRow).join('')}</ul></details>`;
}

function chart() {
  const h = D.history.filter(x => x.completion != null);
  if (h.length < 2) return '<p class="muted">The completion chart fills in as you refresh (one point per refresh).</p>';
  const vals = h.flatMap(x => [x.completion, x.base_completion]).filter(v => v != null);
  const lo = Math.floor(Math.min(...vals)) - 0.5, hi = Math.ceil(Math.max(...vals)) + 0.5;
  const X = i => 10 + i * (580 / (h.length - 1)), Y = v => 150 - (v - lo) / (hi - lo) * 140;
  const line = (key, col) => `<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${h.map((x, i) =>
    x[key] == null ? '' : `${X(i)},${Y(x[key])}`).join(' ')}"/>`;
  return `<div class="chart"><svg viewBox="0 0 600 160" preserveAspectRatio="none">${line('completion', 'var(--accent)')}
    ${line('base_completion', 'var(--good)')}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Completion</span>
    <span><i style="background:var(--good)"></i>Without DLC</span>
    <span>${esc(h[0].date)} – ${esc(h[h.length - 1].date)}</span></div></div>`;
}

function render(filter) {
  const show = g => filter === 'all' || (filter === 'active' ? ['Playing', 'Next'].includes(g.status)
    : filter === 'dlc' ? g.base === 1 && g.dlc_left > 0 : g.status !== 'Dropped');
  const btn = (f, label) => `<button data-f="${f}" aria-pressed="${filter === f}">${label}</button>`;
  document.getElementById('app').innerHTML = `
    <h1>${esc(D.psn)} – Trophy Plan</h1>
    <div class="muted">Last refreshed ${esc(D.date)} · <a href="https://psnprofiles.com/${esc(D.psn)}" target="_blank" rel="noopener">PSNProfiles</a></div>
    ${stats()}
    ${watch()}
    ${planner()}
    <h2>Priority order</h2>
    <div class="filters">${btn('plan', 'Plan')}${btn('active', 'Playing / Next')}${btn('dlc', 'Only DLC left')}${btn('all', 'All incl. dropped')}</div>
    ${D.plan.map((g, i) => show(g) ? game(g, i) : '').join('') || '<p class="muted">Nothing here.</p>'}
    ${easiest()}
    <h2>Since last refresh</h2>
    <table><tr><th>Change</th><th>Game / stat</th><th>Detail</th></tr>
      ${D.changes.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>
    <h2>Completion over time</h2>${chart()}
    <p class="muted">Completion is PSNProfiles' figure: trophy points earned out of points available in started games
      (bronze 15, silver 30, gold 90; platinums don't count). Tap a game for details.</p>`;
  document.querySelectorAll('.filters button').forEach(b => b.onclick = () => render(b.dataset.f));
}
render('plan');
</script>
